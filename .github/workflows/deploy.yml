name: Build and Deploy to GHCR

on:
  workflow_dispatch:
      inputs:
        environment:
          description: 'Environment to deploy to'
          type: choice
          required: true
          default: 'production'
          options:
            - production
            - staging
            - development
        deploy_branch:
          description: 'Confirm branch to deploy (Manual note)'
          required: false
          default: 'main'

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: buildprocure/buildhub
          path: ilife-items-frontend
          token: ${{ secrets.GH_PAT }}

      - name: Checkout CSS
        uses: actions/checkout@v4
        with:
          repository: buildprocure/bp-style-css
          path: ilifes-style-css
          token: ${{ secrets.GH_PAT }}

      - name: Generate commit tags
        id: vars
        run: |
          APP_COMMIT_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-9)

          cd ilife-items-frontend
          ITEMS_COMMIT_SHORT=$(git rev-parse --short=9 HEAD)

          cd ../ilifes-style-css
          STYLE_COMMIT_SHORT=$(git rev-parse --short=9 HEAD)

          TAG="${APP_COMMIT_SHORT}-${ITEMS_COMMIT_SHORT}-${STYLE_COMMIT_SHORT}"
          IMAGE_BASE="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"

          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_BASE=$IMAGE_BASE" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Debug structure
        run: |
          pwd
          ls -la

      - name: Copy CSS
        run: |
          cp ilifes-style-css/global_bp.css .

      - name: Build Docker Image
        run: |
          docker build \
            --no-cache \
            -t ${{ steps.vars.outputs.IMAGE_BASE }}:${{ steps.vars.outputs.TAG }} \
            -t ${{ steps.vars.outputs.IMAGE_BASE }}:latest \
            -f dockerfile \
            .

      - name: Push Docker Images
        run: |
          docker push ${{ steps.vars.outputs.IMAGE_BASE }}:${{ steps.vars.outputs.TAG }}
          docker push ${{ steps.vars.outputs.IMAGE_BASE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          INFOPAGE_USER: ${{ secrets.INFOPAGE_USER }}
          INFOPAGE_PASS: ${{ secrets.INFOPAGE_PASS }}
          MAIL_USERNAME : ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD : ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GH_PAT,LETSENCRYPT_EMAIL,MYSQL_USER,MYSQL_PASSWORD,INFOPAGE_USER,INFOPAGE_PASS,MAIL_USERNAME,MAIL_PASSWORD
          script: |
            set -e

            cd /var/www/html

            if [ -z "$GH_PAT" ]; then
              echo "GH_PAT is missing on remote shell"
              exit 1
            fi

            echo "Downloading latest docker-compose.yml..."
            curl -fsSL \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/buildprocure/procurex/contents/docker-compose.yml?ref=main" \
              -o docker-compose.yml

            echo "Downloading latest php-env-prod.env..."
            curl -fsSL \
              -H "Authorization: Bearer $GH_PAT" \
              -H "Accept: application/vnd.github.raw" \
              "https://api.github.com/repos/buildprocure/procurex/contents/php-env-prod.env?ref=main" \
              -o php-env-prod.env

            echo "Appending secrets to php-env-prod.env..."
            cat >> php-env-prod.env <<EOF
            MYSQL_USER=${MYSQL_USER}
            MYSQL_PASSWORD=${MYSQL_PASSWORD}
            INFOPAGE_USER=${INFOPAGE_USER}
            INFOPAGE_PASS=${INFOPAGE_PASS}
            MAIL_USERNAME=${MAIL_USERNAME}
            MAIL_PASSWORD=${MAIL_PASSWORD}
            EOF
            chmod 600 php-env-prod.env
            
            echo "Downloaded docker-compose.yml:"
            cat docker-compose.yml



            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            echo "Pulling latest images..."
            docker-compose pull

            echo "Stopping containers for certificate maintenance..."
            docker-compose down --remove-orphans

            echo "Ensuring Let's Encrypt directories exist..."
            sudo mkdir -p /etc/letsencrypt /var/lib/letsencrypt /var/www/certbot

            CERT_NAME="buildprocure.com"
            CERT_DIR="/etc/letsencrypt/live/${CERT_NAME}"
            CERT_FULLCHAIN="${CERT_DIR}/fullchain.pem"
            CERT_PRIVKEY="${CERT_DIR}/privkey.pem"
            CERTBOT_IMAGE="certbot/certbot:latest"

            EMAIL_ARGS="--register-unsafely-without-email"
            if [ -n "${LETSENCRYPT_EMAIL:-}" ]; then
              EMAIL_ARGS="--email ${LETSENCRYPT_EMAIL}"
            fi

            CERTBOT_BASE_ARGS="--rm \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/lib/letsencrypt:/var/lib/letsencrypt \
              -v /var/www/certbot:/var/www/certbot"

            if [ ! -f "$CERT_FULLCHAIN" ] || [ ! -f "$CERT_PRIVKEY" ]; then
              echo "Let's Encrypt certificate not found. Issuing initial certificate..."
              docker run $CERTBOT_BASE_ARGS -p 80:80 "$CERTBOT_IMAGE" certonly \
                --standalone \
                --non-interactive \
                --agree-tos \
                $EMAIL_ARGS \
                --cert-name "$CERT_NAME" \
                -d buildprocure.com \
                -d www.buildprocure.com \
                -d hub.buildprocure.com \
                -d hirenow.buildprocure.com \
                -d ncees.buildprocure.com \
                -d app.buildprocure.com 
            elif [ -f "/etc/letsencrypt/renewal/${CERT_NAME}.conf" ]; then
              echo "Let's Encrypt certificate found. Running renewal check..."
              docker run $CERTBOT_BASE_ARGS -p 80:80 "$CERTBOT_IMAGE" renew \
                --cert-name "$CERT_NAME" \
                --standalone \
                --non-interactive
            else
              echo "Certificate files already exist, but no Certbot renewal config was found. Skipping issuance."
            fi

            echo "Restarting containers..."
            docker-compose up -d

            echo "Cleaning old images..."
            docker image prune -f

            docker ps -a
